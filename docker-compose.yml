services:
  backend:
    image: wh0mm1/mahindra-oem-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mahindra-oem-backend
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: wh0mm1/mahindra-oem-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mahindra-oem-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://backend:8000}
    depends_on:
      - backend
    restart: unless-stopped
